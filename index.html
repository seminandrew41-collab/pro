// Оценки настроены так, чтобы по Химии средний балл был ровно 3,33 ((4+3+3)/3 = 3,33)
const defaultGrades = [
{ subject: 'Химия', value: 4, weight: 10, date: '18.11 (Ср)' },
{ subject: 'Биология', value: 4, weight: 10, date: '17.11 (Вт)' },
{ subject: 'Ин. яз. 1', value: 5, weight: 10, date: '13.11 (Пт)' },
{ subject: 'Химия', value: 3, weight: 10, date: '11.11 (Ср)' },
{ subject: 'Химия', value: 3, weight: 10, date: '05.11 (Чт)' }
];
let grades = JSON.parse(localStorage.getItem('morozova_grades_v2')) || [...defaultGrades];
let editingIndex = -1;
function toggleHomeSched(day) {
document.getElementById('btn-today').classList.toggle('active', day === 'today');
document.getElementById('btn-tomorrow').classList.toggle('active', day === 'tomorrow');
document.getElementById('home-sched-title').textContent = day === 'tomorrow' ? 'Расписание на завтра' : 'Расписание на сегодня';
const list = document.getElementById('home-lessons-list');
list.innerHTML = homeSchedules[day].map(l => <div class="lesson-row"> <div class="lesson-left"> <div class="lesson-num-badge">${l.num}</div> <div> <div class="lesson-name">${l.name}</div> <div class="lesson-time">${l.time}</div> </div> </div> <span class="day-tag">${l.tag}</span> </div>).join('');
}
function renderGrades() {
const filterSelect = document.getElementById('subject-filter');
const currentFilter = filterSelect.value || 'Химия';
const subjects = [...new Set(grades.map(g => g.subject))];
filterSelect.innerHTML = 'Все предметы' +
subjects.map(s => <option value="${s}" ${s === currentFilter ? 'selected' : ''}>${s}</option>).join('');
const filtered = currentFilter === 'all' ? grades : grades.filter(g => g.subject === currentFilter);
let totalWeighted = 0;
let totalWeight = 0;
filtered.forEach(g => {
totalWeighted += g.value * g.weight;
totalWeight += g.weight;
});
const avg = totalWeight > 0 ? (totalWeighted / totalWeight).toFixed(2).replace('.', ',') : '0,00';
document.getElementById('big-avg-score').textContent = avg;
document.getElementById('card-avg-score').textContent = avg;
document.getElementById('new-grades-count').textContent = grades.length;
document.getElementById('chart-pt-1').textContent = avg;
document.getElementById('chart-pt-2').textContent = avg;
document.getElementById('chart-pt-3').textContent = avg;
const list = document.getElementById('grades-list');
list.innerHTML = grades.map((g, idx) => <div class="grade-row" onclick="openGradeModal(${idx})"> <div class="grade-subj">${g.subject}</div> <div class="grade-meta"> <div class="grade-pill grade-${g.value}">${g.value}</div> <div class="grade-weight">⚖ ${g.weight} 🕒</div> <div class="grade-date-pill">${g.date}</div> </div> </div>).join('');
}
function openGradeModal(index) {
editingIndex = index;
const delBtn = document.getElementById('btn-delete-grade');
if (index >= 0) {
const g = grades[index];
document.getElementById('modal-title').textContent = 'Изменить оценку';
document.getElementById('input-subject').value = g.subject;
document.getElementById('input-value').value = g.value;
document.getElementById('input-weight').value = g.weight;
document.getElementById('input-date').value = g.date;
delBtn.style.display = 'block';
} else {
document.getElementById('modal-title').textContent = 'Новая оценка';
document.getElementById('input-subject').value = 'Химия';
document.getElementById('input-value').value = '5';
document.getElementById('input-weight').value = '10';
document.getElementById('input-date').value = '19.11 (Чт)';
delBtn.style.display = 'none';
}
openSheet('gradeModal');
}
function saveGrade() {
const subject = document.getElementById('input-subject').value.trim() || 'Химия';
const value = parseInt(document.getElementById('input-value').value, 10);
const weight = parseInt(document.getElementById('input-weight').value, 10) || 10;
const date = document.getElementById('input-date').value.trim() || '19.11 (Чт)';
if (editingIndex >= 0) {
grades[editingIndex] = { subject, value, weight, date };
} else {
grades.unshift({ subject, value, weight, date });
}
localStorage.setItem('morozova_grades_v2', JSON.stringify(grades));
closeSheets();
renderGrades();
}
function deleteGrade() {
if (editingIndex >= 0) {
grades.splice(editingIndex, 1);
localStorage.setItem('morozova_grades_v2', JSON.stringify(grades));
closeSheets();
renderGrades();
}
}
function resetGrades() {
grades = [...defaultGrades];
localStorage.setItem('morozova_grades_v2', JSON.stringify(grades));
closeSheets();
renderGrades();
}
function switchTab(tab) {
['home', 'diary', 'schedule', 'reports'].forEach(t => {
document.getElementById('view-' + t).classList.toggle('hidden', t !== tab);
const nav = document.getElementById('nav-' + t);
if (nav) nav.classList.toggle('active', t === tab);
});
window.scrollTo({ top: 0, behavior: 'smooth' });
}
function openSheet(id) {
closeSheets();
document.getElementById(id).classList.add('open');
}
function closeSheets() {
document.querySelectorAll('.sheet-overlay').forEach(el => el.classList.remove('open'));
}
function toggleTheme() {
const isDark = document.body.classList.toggle('dark-theme');
document.getElementById('moon-icon').classList.toggle('active', isDark);
document.getElementById('sun-icon').classList.toggle('active', !isDark);
}
toggleHomeSched('tomorrow');
renderGrades();
